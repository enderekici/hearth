<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Hearth · Calendar</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/calendar-view.css">
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/calendar-home.css">
  <script type="module" src="/calendar-home.js"></script>
</head>
<body data-palette="ink" class="calendar-home night">
  <header class="home-header">
    <h1>Calendar</h1>
    <div class="home-actions"><time id="clock" aria-label="Current time">--:--</time><button id="settings-open" aria-label="Calendar settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  </header>
  <main id="calendar" aria-label="Family calendar"></main>
  <p id="connection-status" role="status">Loading calendar…</p>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-top"><h2 id="settings-title">Calendar settings</h2><button id="settings-close">Done</button></div>
    <label class="setting-row">Appearance<select id="theme"><option value="auto">Automatic day / night</option><option value="light">Day</option><option value="dark">Night</option></select></label>
    <h3>View</h3><div id="view-options"></div>
    <h3>Calendars to display</h3>
    <form id="calendar-form"><div id="calendar-options">Loading calendars…</div><button type="submit" id="save-calendars">Save calendars</button></form>
    <p id="settings-feedback" role="status"></p>
    <a href="/dashboard.html?settings=1">Connections and other settings</a>
    <a href="/dashboard.html">Open full dashboard</a>
  </dialog>
</body>
</html>
