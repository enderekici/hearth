services:
  hearth-dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "${HEARTH_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    environment:
      PORT: 8787
      DATA_DIR: /app/data
      PHOTO_DIR: /app/photos
      ALLOWED_HOSTS: "${HEARTH_ALLOWED_HOSTS:-127.0.0.1,localhost}"
    volumes:
      - ${HEARTH_DATA_DIR:-./data}:/app/data
      - ${HEARTH_PHOTO_DIR:-./photos}:/app/photos:ro
